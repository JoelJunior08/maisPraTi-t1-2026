spring.application.name=api

# ---------------------------------------------------------------------
# COMO LER ESTE ARQUIVO
# ---------------------------------------------------------------------
# ${NOME:padrao} = "use a variável de ambiente NOME; se ela não existir,
# use `padrao`". É assim que o MESMO .jar roda em todo lugar: na sua
# máquina valem os padrões (localhost); no Docker/Railway, as variáveis
# de ambiente configuradas lá sobrescrevem tudo.
#
# Segredos (Stripe, JWT de produção) NÃO têm padrão aqui — ficam no
# arquivo .env (fora do Git) ou no painel da plataforma.
# ---------------------------------------------------------------------

# Lê o arquivo .env da raiz do projeto como se fosse um .properties.
# `optional:` = se o arquivo não existir (caso do container), segue a vida.
# Assim, rodando pelo IntelliJ, os segredos vêm do mesmo .env que o
# docker compose usa — uma fonte só.
spring.config.import=optional:file:.env[.properties]

# Railway e Render dizem em qual porta a app deve escutar pela variável PORT.
server.port=${PORT:8080}

# --- Banco de dados ---------------------------------------------------
# DATABASE_URL precisa estar no formato JDBC: jdbc:postgresql://host:porta/banco
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/clarim_diario}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:root}

# Quem cria as tabelas é o Flyway (db/migration). O Hibernate só confere
# se as entidades batem com o banco — e derruba o boot se não baterem.
spring.jpa.hibernate.ddl-auto=validate

# Seu banco LOCAL já tem as tabelas, mas nunca teve o Flyway. Sem isto, o
# Flyway veria tabelas "desconhecidas" e se recusaria a rodar. Com isto,
# num banco que já tem tabelas e nenhum histórico, ele só anota "estou na
# versão 3" e não executa V1..V3. Num banco VAZIO (Docker/Railway), essas
# duas linhas não têm efeito: ele roda V1, V2 e V3 normalmente.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3

# Em produção, logar todo SQL só gera ruído (e custo de log). Ligue com
# SHOW_SQL=true quando quiser depurar.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

# --- Health check -----------------------------------------------------
# Só o /actuator/health fica exposto (padrão do Spring), e sem detalhes.
management.endpoint.health.show-details=never

# --- Segurança / integrações -----------------------------------------
# O padrão só serve para desenvolvimento. Em produção é OBRIGATÓRIO
# definir JWT_SECRET (gere com: openssl rand -base64 48).
jwt.secret=${JWT_SECRET:chave-de-desenvolvimento-testes-no-ambiente-local-1234}
jwt.expiracao-minutos=60

google.client-id=${GOOGLE_CLIENT_ID:510274226954-jkhcn1hqsj6vfcmn6dn3lol8msoq4qn8.apps.googleusercontent.com}

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# Para onde o Stripe devolve o navegador após o checkout.
app.front-url=${FRONT_URL:http://localhost:5173}

# Quais sites podem chamar esta API pelo navegador (CORS). Separados por
# vírgula; aceita curinga, ex.: https://clarim-diario-*.vercel.app
app.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:5173}
